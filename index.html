<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공정한 즐거움</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 친절한 좌석 태블릿 안내원 — 아이도, 외국인도, 어르신도 한눈에.
   IDEA: 기차·비행기 좌석 태블릿 + 단청 색으로 꾸민 여행 스탬프북.
   PICTURE: 오송역 기차와 청주공항 비행기가 충북 산과 탑으로 가는 장면, 여행지마다 그린 퍼즐 그림.
   COLOUR and TYPE: 소나무 초록 바탕, 단청 빨강 강조, 하늘 파랑 보조 / 주아체(Jua) 전체.
   LAYOUT: 상단 바 → 한 화면씩 진행(시작·설문·추천·체험) → 아래 도장판. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1a17);--ink:light-dark(#14221e,#eef3ef);--sub:light-dark(#4f5f59,#a9bab3);
--pine:light-dark(#165243,#2c8a72);--pineD:light-dark(#0e3a30,#0b2a23);--red:light-dark(#d33b26,#ff6a50);
--sky:light-dark(#2f78c4,#6aa9ec);--card:light-dark(#f2f6f3,#17262170);--line:light-dark(#d6e0db,#2a3b35);--chip:light-dark(#ffffff,#1b2c27)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;font-synthesis:none}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Jua","Noto Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all;overflow-wrap:anywhere}
body.big{font-size:21px}
body.hc{--bg:#000;--ink:#fff;--sub:#ffeb3b;--pine:#000;--pineD:#000;--card:#111;--line:#fff;--chip:#000;--red:#ffeb3b;--sky:#7fd4ff}
h1,h2,h3{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,52px)}h2{font-size:clamp(26px,4vw,36px)}h3{font-size:24px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{background:var(--pine);color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px max(4vw,14px)}
body.hc .top{border-bottom:2px solid #fff}
.logo{display:flex;align-items:center;gap:10px;font-family:"Jua";font-size:26px}
.logo svg{width:38px;height:38px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtn{min-height:44px;padding:6px 14px;border-radius:22px;border:2px solid #ffffff60;background:transparent;color:#fff;font-size:15px}
.tbtn[aria-pressed=true]{background:#fff;color:var(--pineD);border-color:#fff}
body.hc .tbtn[aria-pressed=true]{background:#ffeb3b;color:#000}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,14px)}
.screen{display:none}.screen.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}*{transition:none!important}}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(18px,4vw,40px);align-items:center}
.hero svg{width:100%;height:auto;border-radius:22px;display:block}
.lead{color:var(--sub);margin:12px 0 22px;max-width:36em}
.label{font-weight:700;margin:20px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;padding:8px 18px;border-radius:26px;border:2px solid var(--line);background:var(--chip);font-size:16px;transition:.15s}
body.big .chip{font-size:20px}
.chip[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#fff}
body.hc .chip[aria-pressed=true]{background:#ffeb3b;color:#000;border-color:#ffeb3b}
.origin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ob{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--chip);text-align:left;min-height:96px}
.ob b{font-family:"Jua";font-size:24px;font-weight:400}.ob small{color:var(--sub);font-size:14px}
.ob[aria-pressed=true]{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 30%,transparent)}
.go{margin-top:26px;min-height:56px;padding:10px 30px;border-radius:30px;border:0;background:var(--red);color:#fff;font-size:20px;font-weight:700}
body.hc .go{color:#000}
.go:disabled{opacity:.4;cursor:not-allowed}
.ghost{min-height:48px;padding:8px 20px;border-radius:26px;border:2px solid var(--line);background:transparent;font-size:16px}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{height:6px;flex:1;border-radius:3px;background:var(--line)}.steps i.on{background:var(--red)}
.q{background:var(--card);border-radius:22px;padding:clamp(18px,3vw,30px);border:1px solid var(--line)}
.q h2{margin-bottom:6px}.q p{color:var(--sub);margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px}
.results{display:grid;gap:18px;margin-top:20px}
.res{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;align-items:start}
.res .pic{border-radius:16px;overflow:hidden;aspect-ratio:1}.res .pic svg{width:100%;height:100%;display:block}
.rank{display:inline-block;background:var(--red);color:#fff;font-family:"Jua";font-size:18px;padding:2px 12px;border-radius:14px;margin-right:8px}
body.hc .rank{color:#000}
.meter{height:10px;border-radius:5px;background:var(--line);margin:10px 0 4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--pine)}
body.hc .meter i{background:#ffeb3b}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--sub);font-size:15px;margin:8px 0 12px}
body.big .facts{font-size:18px}
.why{font-size:15px;margin:0 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{min-height:44px;padding:6px 16px;border-radius:22px;border:2px solid var(--pine);background:transparent;font-size:15px;font-weight:500}
body.big .act{font-size:19px}
.act.main{background:var(--pine);color:#fff}
body.hc .act{border-color:#fff}body.hc .act.main{background:#ffeb3b;color:#000}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,34px);align-items:start;margin-top:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.story{font-size:18px;line-height:1.8}body.big .story{font-size:22px}
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--pineD);padding:3px;border-radius:16px;aspect-ratio:1;width:100%;max-width:460px}
.tile{border:0;border-radius:6px;background-size:300% 300%;background-repeat:no-repeat;aspect-ratio:1;outline-offset:-3px}
.tile.sel{outline:4px solid var(--red)}
.puz.done{gap:0;padding:0}.puz.done .tile{border-radius:0}
.msg{min-height:1.6em;font-weight:700;color:var(--red);margin:10px 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{min-height:52px;text-align:left;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--chip);font-size:17px}
body.big .opt{font-size:21px}
.opt.ok{border-color:#2e9b5b;background:color-mix(in srgb,#2e9b5b 18%,var(--chip))}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 15%,var(--chip))}
.book{margin-top:44px;position:relative;background:light-dark(#fffdf7,#14221f);border-radius:28px;padding:30px clamp(18px,3vw,34px) 28px;box-shadow:0 14px 40px #0b2a4a2e;overflow:hidden}
.book::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(90deg,#d33b26 0 28px,#f2b632 28px 40px,#2f8a5f 40px 68px,#2f6fb5 68px 80px)}
.bookHead{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bookSeal{flex:none;width:104px;height:104px;border-radius:50%;border:4px double #d33b26;color:#d33b26;display:grid;place-content:center;text-align:center;transform:rotate(-8deg);font-family:"Jua";line-height:1;background:light-dark(#fff4f1,#2a1a17)}
.bookSeal span{font-size:44px}.bookSeal small{font-size:18px}
.bookInfo{flex:1 1 260px}.bookInfo h3{font-size:28px}
.bookLv{margin:4px 0 10px;font-weight:700;color:#d33b26}
.bookBar{height:14px;border-radius:7px;background:light-dark(#e6ece9,#24352f);overflow:hidden}.bookBar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#f2b632,#d33b26);transition:width .6s}
.bookLead{margin:8px 0 0;color:var(--sub);font-size:15px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 12px;margin-top:24px}
.slot{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit}
.ring{position:relative;width:min(96px,100%);aspect-ratio:1;border-radius:50%;padding:5px;border:3px dashed light-dark(#b9c7c1,#47605a);transition:transform .2s}
.ring img,.ring svg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;filter:grayscale(1);opacity:.45}
.slot:hover .ring{transform:scale(1.06)}
.slot.got .ring{border:4px double #d33b26;transform:rotate(-6deg)}.slot.got .ring img,.slot.got .ring svg{filter:none;opacity:1}
.seal{position:absolute;right:-8px;bottom:-4px;background:#d33b26;color:#fff;font-style:normal;font-family:"Jua";font-size:14px;padding:3px 9px;border-radius:12px;transform:rotate(-12deg);box-shadow:0 3px 8px #0003}
.nm{font-size:14px;text-align:center;line-height:1.25;color:var(--sub)}.slot.got .nm{color:#d33b26;font-weight:700}
body.hc .book{background:#000;border:2px solid #fff}body.hc .ring img{opacity:.7}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.st{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:13px;color:var(--sub);padding:4px;line-height:1.2}
.st.got{border:3px solid var(--red);color:var(--red);font-family:"Jua";font-size:14px;transform:rotate(-8deg);background:color-mix(in srgb,var(--red) 8%,transparent)}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);background:var(--pineD);color:#fff;border-radius:20px;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0005;transition:transform .4s,visibility .4s;visibility:hidden;z-index:9;max-width:calc(100vw - 24px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{min-height:44px;border-radius:22px;border:0;padding:6px 16px;background:var(--red);color:#fff;font-weight:700}
.logo{flex:none;background:#fff;border:0;color:#fff;padding:6px 16px;min-height:48px;border-radius:30px;box-shadow:0 2px 8px #0002}
.titleImg{height:40px;width:167px;min-width:167px;max-width:none;flex:none;display:block;object-fit:contain}
@media(max-width:560px){.titleImg{height:30px;width:125px;min-width:125px}}
.ob{padding:10px 10px 16px;gap:6px}.ob img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;display:block;margin-bottom:6px}.ob b{font-size:30px;padding-left:6px}.ob small{font-size:15px;padding-left:6px}
.hub{margin-top:clamp(34px,5vw,56px);background:var(--pine);color:#fff;border-radius:26px;padding:clamp(20px,3.5vw,36px)}
body.hc .hub{border:2px solid #fff}
.hub .lead{color:#ffffffd0;margin:8px 0 18px}body.hc .hub .lead{color:#ffeb3b}
.searchRow{display:flex;flex-wrap:wrap;gap:10px}
#q{flex:1 1 260px;min-height:56px;border-radius:30px;border:0;padding:0 22px;font:inherit;font-size:18px;background:#fff;color:#14221e}
.searchRow .go{margin:0;flex:none}
#searchRes{display:grid;gap:10px;margin-top:14px}
.sr{display:flex;gap:14px;align-items:center;background:#ffffff14;border-radius:16px;padding:10px;flex-wrap:wrap}
.srPic{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none}.srPic svg{width:100%;height:100%;display:block}
.sr>img,.sr>svg{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.sr b{font-family:"Jua";font-weight:400;font-size:21px;display:block}.sr small{color:#ffffffc0}
.sr .acts{margin-left:auto}.sr .act{border-color:#fff;color:#fff}.sr .act.main{background:#fff;color:var(--pineD)}
.galT{margin:26px 0 12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gi{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;aspect-ratio:1;background:#0003}
.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.gi:hover img{transform:scale(1.05)}
.gi span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font-size:14px;color:#fff;text-align:left;background:linear-gradient(transparent,#000b);line-height:1.25}
.qcTop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--sub);margin-bottom:8px}
.qcPic{width:100%;max-width:260px;aspect-ratio:1;border-radius:16px;overflow:hidden;margin:10px 0}.qcPic img,.qcPic svg{width:100%;height:100%;object-fit:cover;display:block}
.bigN{font-family:"Jua";font-size:clamp(48px,9vw,80px);line-height:1;color:var(--red)}
.oPic{margin:0;position:relative;border-radius:22px;overflow:hidden;animation:in .35s ease}.oPic img{width:100%;height:auto;display:block}.oPic figcaption{position:absolute;left:14px;bottom:14px;background:#000a;color:#fff;padding:6px 14px;border-radius:16px;font-family:"Jua";font-size:22px}
.originBlock{margin-top:clamp(22px,4vw,40px)}.originBlock .label{font-size:20px;margin-top:0}
#originPic .oPic{margin-bottom:16px}
.origin{gap:16px}
.moreL{margin:0 0 14px;padding-left:1.2em}.moreL li{margin:6px 0}
.hero{grid-template-columns:1fr}
.hubGo{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;width:100%;margin-top:clamp(26px,4vw,40px);padding:22px 26px;border:0;border-radius:22px;background:var(--pine);color:#fff;text-align:left}
.hubGo b{font-family:"Jua";font-weight:400;font-size:clamp(26px,4vw,34px)}.hubGo small{grid-column:1;font-size:16px;color:#ffffffd0}.hubGo span{grid-row:1/3;grid-column:2;font-size:36px}
body.hc .hubGo{border:2px solid #fff}
.homeBtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:clamp(26px,4vw,40px)}
.hb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:130px;padding:22px;border:0;border-radius:22px;color:#fff;text-align:left;justify-content:flex-end}
.hb b{font-family:"Jua";font-weight:400;font-size:clamp(26px,3.4vw,32px);line-height:1.1}.hb small{font-size:15px;color:#ffffffde}
.hb.pz{background:#d33b26}.hb.qz{background:#2f6fb5}.hb.sd{background:#165243}
body.hc .hb{background:#000;border:3px solid #ffeb3b}
.oPic img{aspect-ratio:3/2!important;object-fit:cover;height:auto}
.win{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}.win[hidden]{display:none}
.winBack{position:absolute;inset:0;background:#0009}
.winBox{position:relative;width:min(1000px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg);border-radius:24px;box-shadow:0 20px 60px #0006;animation:in .25s ease}
.winHead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px 14px 24px;color:#fff;background:#165243}
.winBox[data-k=puzzle] .winHead{background:#d33b26}.winBox[data-k=quiz] .winHead{background:#2f6fb5}
body.hc .winHead{background:#000!important;border-bottom:2px solid #fff}
.winX{width:48px;height:48px;border-radius:50%;border:2px solid #ffffff90;background:transparent;color:#fff;font-size:30px;line-height:1}
.winBody{padding:clamp(16px,3vw,28px)}
.wpGrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
.gal.small{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:520px;overflow:auto}.gal.small .gi span{font-size:12px;padding:14px 6px 5px}
#w_study .gi{background:#0002}#w_study .gi svg{width:100%;height:100%}
#w_study #q{width:100%;min-height:54px;border-radius:28px;border:2px solid var(--line);padding:0 20px;font:inherit;font-size:18px;background:var(--chip);color:var(--ink)}
.stGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;margin-top:14px;align-items:start}
.stPic{border-radius:18px;overflow:hidden}.stPic img,.stPic svg{width:100%;display:block}
.qcGrid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px;align-items:center;margin:10px 0}.qcGrid .qcPic{margin:0;max-width:none}
@media(max-width:760px){.homeBtns,.wpGrid,.stGrid{grid-template-columns:1fr}.qcGrid{grid-template-columns:100px minmax(0,1fr)}}
body.home{background:linear-gradient(180deg,light-dark(#e6f3ff,#0b1f3a) 0%,light-dark(#b9dcfb,#123a6b) 45%,light-dark(#7db8ee,#1b5596) 100%);min-height:100vh;--line:light-dark(#a9c9e8,#3a5f8a)}
body.home .lead{color:light-dark(#2c4660,#c6d8ec)}
body.home.hc{background:#000}

.ptsBtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 16px 4px 5px;border-radius:24px;border:0;background:#ffd54a;color:#4a3200;font-size:19px;box-shadow:0 2px 8px #0003}
.ptsBtn.pop{animation:pop .5s ease}@keyframes pop{40%{transform:scale(1.18)}}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3b0,#f2b632 55%,#c98a00);color:#7a4d00;font-size:17px;box-shadow:inset 0 -2px 0 #0002}
.ptsFloat{position:fixed;z-index:30;transform:translateX(-50%);font-size:26px;color:#f2a900;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp 1.6s ease forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,60px)}}
.winBox[data-k=points] .winHead{background:#d89a0e}
.ptsTop{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.ptsCoin{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;color:#7a4d00;background:radial-gradient(circle at 35% 30%,#fff3b0,#f2b632 55%,#c98a00);box-shadow:inset 0 -4px 0 #0002,0 6px 16px #c98a0055}
.ptsBig{font-size:clamp(44px,8vw,64px);line-height:1;color:#c98a00}.ptsBig span{font-size:.5em;margin-left:4px}
.ptsCols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.ptsHow,.ptsLog{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.ptsHow li,.ptsLog li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.ptsHow b,.ptsLog b{color:#c98a00;font-weight:400}.ptsLog small{width:100%;color:var(--sub);font-size:13px}
@media(max-width:760px){.ptsCols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ptsFloat,.ptsBtn.pop{animation:none}}
.rankBtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px;border-radius:24px;border:2px solid #ffd54a;background:transparent;color:#ffd54a;font-size:16px}.rankBtn svg{width:22px;height:22px}
.winBox[data-k=rank] .winHead{background:#7a4fc4}
.rkMe{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:18px;border-radius:20px;background:light-dark(#f4efff,#221a33);border:1px solid light-dark(#d8c9f5,#3b2c5a)}
.rkMePts{display:flex;align-items:center;gap:8px}.rkMePts b{font-size:40px;color:#c98a00;line-height:1}.rkMePts small{font-size:20px;color:#c98a00}
.rkForm{display:flex;flex-wrap:wrap;gap:10px;flex:1 1 300px}.rkForm input{flex:1 1 180px;min-height:52px;border-radius:26px;border:2px solid var(--line);padding:0 18px;font:inherit;font-size:18px;background:var(--chip);color:var(--ink)}.rkForm .go{margin:0}
.rkMe .msg{width:100%;margin:0;min-height:0}
.rkNote{color:var(--sub);font-size:15px;margin:16px 0 8px}
.rkList{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rkList li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:19px}
.rkNo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:light-dark(#e3e9e6,#2a3a35);font-size:18px}
.rkNick{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rkList b{font-weight:400;color:#c98a00}
.rkList li.top1 .rkNo{background:linear-gradient(135deg,#ffe27a,#e0a800);color:#5a3d00}
.rkList li.top2 .rkNo{background:linear-gradient(135deg,#f2f4f7,#a9b2bd);color:#333}
.rkList li.top3 .rkNo{background:linear-gradient(135deg,#f3c39b,#b8733a);color:#3b1f08}
.rkList li.top1{font-size:22px;border-color:#e0a800}
.rkList li.me{outline:3px solid #7a4fc4;background:light-dark(#f4efff,#221a33)}
.rkEmpty{padding:24px;text-align:center;color:var(--sub)}
.homeSearch{margin-top:clamp(24px,4vw,36px)}
#hq{width:100%;min-height:58px;border-radius:30px;border:2px solid light-dark(#9cc3ee,#3a5f8a);padding:0 24px;font:inherit;font-size:19px;background:var(--chip);color:var(--ink);box-shadow:0 4px 14px #0b2a4a1a}
#hqRes{display:grid;gap:10px;margin-top:12px}
.hsr{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;padding:10px;border-radius:18px;background:var(--chip);border:1px solid var(--line)}
.hsrPic{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none}.hsrPic img,.hsrPic svg{width:100%;height:100%;object-fit:cover;display:block}
.hsrTxt b{display:block;font-weight:400;font-size:20px}.hsrTxt small{color:var(--sub)}
.hsr .acts{margin-left:auto}
.hsrNone{margin:4px 8px;color:var(--sub)}
.note{color:var(--sub);font-size:13px;margin-top:30px}
@media(max-width:760px){.hero,.detail{grid-template-columns:1fr}}
@media(max-width:560px){.stamps{grid-template-columns:repeat(3,minmax(0,1fr))}.bookSeal{width:84px;height:84px}.bookSeal span{font-size:34px}.st{font-size:14px}#dPic{max-width:200px!important}.res{grid-template-columns:1fr}.res .pic{max-width:220px}.origin{grid-template-columns:1fr}.logo span{display:none}}
</style>
</head>

 s:{ko:"온달관광지는 고구려의 장군 온달과 평강공주의 전설을 주제로 꾸민 곳이에요. 온달전시관, 온달산성, 온달동굴, 드라마 촬영장을 한곳에서 볼 수 있어요. 온달동굴은 약 4억 5천만 년 전부터 만들어져 온 것으로 여겨지는 석회암 동굴이고, 드라마 촬영장에서는 「연개소문」, 「태왕사신기」 같은 사극을 찍었어요.",
  en:"Ondal Tourist Park is themed on the legend of the Goguryeo general Ondal and Princess Pyeonggang. It brings together the Ondal Exhibition Hall, Ondal Fortress, Ondal Cave and a drama film set. Ondal Cave is a limestone cave thought to have been forming for about 450 million years, and historical dramas such as Yeon Gaesomun and The Legend were filmed on the set.",
  zh:"温达观光地以高句丽将军温达和平冈公主的传说为主题。在这里可以一次参观温达展示馆、温达山城、温达洞窟和电视剧拍摄地。温达洞窟是被认为约4.5亿年前开始形成的石灰岩洞，拍摄地曾拍摄《渊盖苏文》《太王四神记》等古装剧。"},
 q:{ko:["온달관광지는 누구의 이야기를 주제로 꾸몄을까요?",["온달 장군과 평강공주","견우와 직녀","흥부와 놀부"],0],en:["Whose story is Ondal Tourist Park themed on?",["General Ondal and Princess Pyeonggang","Gyeonu and Jiknyeo","Heungbu and Nolbu"],0],zh:["温达观光地以谁的故事为主题？",["温达将军和平冈公主","牛郎和织女","兴夫和孬夫"],0]}},
{id:"sinchaeho",kind:"village",imgs:["img/deoksudang.jpg"],ll:[36.6430,127.6060],v:[3,0,1,1,1,2],acc:1,
 n:{ko:"청주 신채호 사당 및 묘소",en:"Shrine and Tomb of Sin Chae-ho, Cheongju",zh:"清州申采浩祠堂及墓所"},r:{ko:"청주시 낭성면",en:"Cheongju (Nangseong)",zh:"清州市琅城面"},
 s:{ko:"단재 신채호(1880~1936)는 독립운동가이자 역사학자, 언론인이에요. 신문에 나라 사랑의 마음을 일깨우는 글을 썼고, 「조선상고사」 같은 역사책을 남겼어요. 낭성면 귀래리는 신채호가 어린 시절을 보낸 곳으로, 옛 집터에 사당과 묘소가 있고 1993년 충청북도 기념물로 지정되었어요.",
  en:"Danjae Sin Chae-ho (1880–1936) was an independence activist, historian and journalist. He wrote newspaper articles that stirred love for the nation and left history books such as Joseon Sanggosa (Ancient History of Korea). Guirae-ri in Nangseong-myeon is where he spent his childhood; his shrine and tomb stand on the old house site, designated a Chungcheongbuk-do Monument in 1993.",
  zh:"丹斋申采浩（1880～1936）是独立运动家、历史学家和新闻工作者。他在报纸上撰写唤起爱国之心的文章，并留下了《朝鲜上古史》等史书。琅城面归来里是他度过童年的地方，祠堂和墓所就建在旧宅址上，1993年被指定为忠清北道纪念物。"},
 q:{ko:["신채호가 쓴 역사책은 무엇일까요?",["조선상고사","동의보감","난중일기"],0],en:["Which history book did Sin Chae-ho write?",["Joseon Sanggosa","Donguibogam","Nanjung Ilgi"],0],zh:["申采浩写的史书是哪一本？",["《朝鲜上古史》","《东医宝鉴》","《乱中日记》"],0]}},
{id:"samnyeon",kind:"fortress",imgs:["img/sangdang2.jpg"],ll:[36.4872,127.7408],v:[3,0,2,3,2,1],acc:0,
 n:{ko:"보은 삼년산성",en:"Samnyeonsanseong Fortress, Boeun",zh:"报恩三年山城"},r:{ko:"보은군",en:"Boeun",zh:"报恩郡"},
 s:{ko:"삼년산성은 신라가 470년에 쌓은 돌 산성이에요. 『삼국사기』에는 쌓기 시작한 지 3년 만에 다 지어서 '삼년산성'이라고 불렀다고 적혀 있어요. 둘레가 약 1.7킬로미터이고, 성벽과 옛 시설이 잘 남아 있어 우리나라 산성을 연구하는 기준이 되는 곳이에요.",
  en:"Samnyeonsanseong is a stone mountain fortress built by Silla in 470. According to the Samguk Sagi, it took three years to finish, which is how it got its name, 'Three-Year Mountain Fortress'. Its walls run about 1.7 km, and they are so well preserved that the fortress is a reference point for studying Korean fortresses.",
  zh:"三年山城是新罗于470年修筑的石砌山城。据《三国史记》记载，它从开工到完工用了三年，因此得名“三年山城”。城墙周长约1.7公里，城墙和设施保存完好，是研究韩国山城的标准。"},
 q:{ko:["삼년산성이라는 이름이 붙은 까닭은?",["쌓는 데 3년이 걸려서","왕 3명이 함께 쌓아서","3월에 쌓아서"],0],en:["Why is it called 'Three-Year' Fortress?",["It took three years to build","Three kings built it together","It was built in March"],0],zh:["为什么叫“三年山城”？",["修筑用了三年","三位国王一起修建","在三月修建"],0]}},
{id:"cheongnamdae",kind:"village",imgs:["img/cjmuseum2.jpg"],ll:[36.4612,127.4884],v:[2,0,3,2,3,2],acc:1,
 n:{ko:"청남대",en:"Cheongnamdae",zh:"青南台"},r:{ko:"청주시 문의면",en:"Cheongju",zh:"清州市"},
 s:{ko:"청남대는 '따뜻한 남쪽의 청와대'라는 뜻이에요. 1983년부터 대통령의 별장으로 쓰였고, 2003년 4월 18일에 모든 사람에게 문을 열었어요. 대청호를 따라 난 산책길과 계절마다 피는 꽃이 아름답고, 대통령들이 머물던 본관도 둘러볼 수 있어요.",
  en:"Cheongnamdae means 'the Blue House of the warm south'. It served as the presidential villa from 1983 and opened to the public on 18 April 2003. Its walking paths along Daecheong Lake and seasonal flowers are lovely, and you can tour the main building where presidents stayed.",
  zh:"青南台意为“温暖南方的青瓦台”。自1983年起作为总统别墅使用，2003年4月18日向公众开放。沿大清湖的散步道和四季花卉十分美丽，还可以参观总统们住过的主楼。"},
 q:{ko:["청남대는 원래 누구의 별장이었을까요?",["대통령","조선의 왕","스님"],0],en:["Whose villa was Cheongnamdae originally?",["The president's","A Joseon king's","A monk's"],0],zh:["青南台原来是谁的别墅？",["总统","朝鲜国王","僧人"],0]}},
{id:"munui",kind:"village",imgs:["img/cheongpung1.jpg"],ll:[36.5190,127.4890],v:[3,0,2,2,2,3],acc:1,
 n:{ko:"청주 문의문화재단지",en:"Munui Cultural Heritage Complex, Cheongju",zh:"清州文义文化遗产园区"},r:{ko:"청주시 문의면",en:"Cheongju",zh:"清州市"},
 s:{ko:"1980년 대청댐이 완공될 때 물에 잠길 위기에 놓인 마을의 문화유산을 옮겨 와 옛 마을을 다시 꾸민 곳으로, 1997년에 만들어졌어요. 1666년에 지어진 관청 건물 문산관도 이곳으로 옮겨 왔어요. 언덕 위에서 넓은 대청호가 한눈에 내려다보여요.",
  en:"When Daecheong Dam was completed in 1980, heritage from villages about to be flooded was moved here to recreate an old village; the complex opened in 1997. Munsangwan, a government guesthouse built in 1666, was moved here too. From the hill you get a wide view of Daecheong Lake.",
  zh:"1980年大清坝竣工时，将面临被淹没的村庄文物迁到这里，重现古村落，园区于1997年建成。建于1666年的官衙建筑文山馆也迁到了这里。从山坡上可以俯瞰辽阔的大清湖。"},
 q:{ko:["문의문화재단지에서 내려다보이는 호수는?",["대청호","충주호","의림지"],0],en:["Which lake can you see from the Munui complex?",["Daecheong Lake","Chungju Lake","Uirimji"],0],zh:["从文义文化遗产园区能俯瞰哪个湖？",["大清湖","忠州湖","义林池"],0]}},
{id:"uirimji",kind:"bridge",imgs:["img/free2.jpg"],ll:[37.1745,128.2114],v:[2,0,3,2,3,2],acc:2,
 n:{ko:"제천 의림지",en:"Uirimji Reservoir, Jecheon",zh:"堤川义林池"},r:{ko:"제천시",en:"Jecheon",zh:"堤川市"},
 s:{ko:"의림지는 삼한 시대에 만들어졌다고 전해지는 아주 오래된 저수지예요. 조사해 보니 약 2000년 전부터 저수지가 있었다는 결과도 나왔어요. 지금도 농사에 쓸 물을 대 주고 있고, 둘레 1.8킬로미터의 둘레길을 따라 오래된 소나무와 버드나무 숲이 이어져요.",
  en:"Uirimji is an ancient reservoir said to date from the Samhan period, and research has shown a reservoir existed here about 2,000 years ago. It still supplies water to farms today, and a 1.8 km path around it runs past old pine and willow trees.",
  zh:"义林池相传建于三韩时代，是一座非常古老的水库。研究显示，约2000年前这里就已有水库。它至今仍为农田供水，环湖1.8公里的步道两旁是古老的松树和柳树林。"},
 q:{ko:["의림지는 어떤 곳일까요?",["농사에 쓸 물을 모아 두는 저수지","바닷물로 소금을 만드는 곳","뜨거운 물이 나오는 온천"],0],en:["What is Uirimji?",["A reservoir storing water for farming","A place making salt from seawater","A hot spring"],0],zh:["义林池是什么地方？",["储存农业用水的水库","用海水制盐的地方","温泉"],0]}},
{id:"hwayang",kind:"cliff",imgs:["img/free3.jpg"],ll:[36.6550,127.8060],v:[2,0,3,3,3,2],acc:1,
 n:{ko:"괴산 화양구곡",en:"Hwayang Gugok Valley, Goesan",zh:"槐山华阳九曲"},r:{ko:"괴산군 청천면",en:"Goesan",zh:"槐山郡"},
 s:{ko:"화양구곡은 화양천을 따라 약 3킬로미터에 걸쳐 이어지는 아홉 굽이의 아름다운 계곡이에요. 조선의 학자 송시열이 이곳에 머물며 중국의 무이구곡을 본떠 굽이마다 이름을 붙였다고 전해져요. 2014년에 명승으로 지정되었어요.",
  en:"Hwayang Gugok is a valley of nine scenic bends along about 3 km of the Hwayangcheon stream. The Joseon scholar Song Si-yeol is said to have lived here and named each bend, following China's Wuyi Nine Bends. It was designated a Scenic Site in 2014.",
  zh:"华阳九曲是沿华阳川约3公里延伸的九道美丽溪谷。相传朝鲜学者宋时烈曾隐居于此，仿照中国武夷九曲为每一道弯取了名字。2014年被指定为名胜。"},
 q:{ko:["화양구곡은 몇 굽이의 계곡일까요?",["9굽이","3굽이","12굽이"],0],en:["How many bends does Hwayang Gugok have?",["9","3","12"],0],zh:["华阳九曲共有几道弯？",["9道","3道","12道"],0]}},
{id:"jiyong",kind:"village",imgs:["img/cheongpung2.jpg"],ll:[36.3020,127.5770],v:[2,0,1,1,2,2],acc:2,
 n:{ko:"옥천 정지용 생가",en:"Birthplace of Poet Jeong Ji-yong, Okcheon",zh:"沃川郑芝溶故居"},r:{ko:"옥천군",en:"Okcheon",zh:"沃川郡"},
 s:{ko:"「향수」를 쓴 시인 정지용이 태어난 옥천의 초가집이에요. 1996년에 옛 모습대로 다시 지었어요. 집 앞에는 시에 나오는 것처럼 실개천이 흐르고, 바로 옆 정지용문학관에서 시인의 작품을 더 만날 수 있어요.",
  en:"This thatched house in Okcheon is where Jeong Ji-yong, the poet who wrote 'Hyangsu' (Nostalgia), was born. It was rebuilt in 1996 as it once looked. A small stream flows in front, just like in the poem, and the Jeong Ji-yong Literary Museum next door shows more of his work.",
  zh:"这座位于沃川的草屋是创作《乡愁》的诗人郑芝溶的出生地，1996年按原貌重建。屋前像诗中描写的那样流着小溪，旁边的郑芝溶文学馆还能看到更多他的作品。"},
 q:{ko:["정지용 시인의 대표 시는?",["향수","진달래꽃","서시"],0],en:["Which is Jeong Ji-yong's best-known poem?",["Hyangsu (Nostalgia)","Azaleas","Prologue"],0],zh:["郑芝溶的代表诗作是？",["《乡愁》","《金达莱花》","《序诗》"],0]}},
{id:"goguryeo",kind:"photo",imgs:["img/goguryeo1.jpg"],ll:[37.0195,127.8977],v:[3,0,1,1,1,2],acc:2,
 n:{ko:"충주 고구려비",en:"Goguryeo Stele, Chungju",zh:"忠州高句丽碑"},r:{ko:"충주시 중앙탑면",en:"Chungju",zh:"忠州市"},
 s:{ko:"충주 고구려비는 한반도에 남아 있는 단 하나뿐인 고구려 비석이에요. 마을 어귀에 오랫동안 서 있던 돌이었는데, 1979년에 조사해 보니 고구려 글자가 새겨진 비석이었어요. 높이 약 2미터 돌기둥의 네 면에 글자를 새겼고, 고구려가 남한강 유역까지 힘을 넓혔다는 것을 알려 줘요. 지금은 충주 고구려비 전시관에서 볼 수 있어요.",
  en:"The Chungju Goguryeo Stele is the only Goguryeo stele left on the Korean Peninsula. It stood for a long time at the entrance of a village, until a survey in 1979 revealed Goguryeo writing on it. Text was carved on all four sides of the stone pillar, about 2 m tall, showing that Goguryeo extended its power to the Namhangang River area. Today you can see it at the Chungju Goguryeo Stele Exhibition Hall.",
  zh:"忠州高句丽碑是朝鲜半岛上唯一留存的高句丽石碑。它长期立在村口，直到1979年调查时，人们才发现上面刻着高句丽文字。这根约2米高的石柱四面都刻有文字，说明高句丽的势力曾扩展到南汉江流域。如今可以在忠州高句丽碑展览馆参观。"},
 q:{ko:["충주 고구려비는 어느 나라가 세운 비석일까요?",["고구려","백제","신라"],0],en:["Which kingdom erected the Chungju stele?",["Goguryeo","Baekje","Silla"],0],zh:["忠州的这块石碑是哪个国家立的？",["高句丽","百济","新罗"],0]}},
{id:"cjmuseum",kind:"photo",imgs:["img/cjmuseum1.jpg"],ll:[36.6533,127.5083],v:[3,1,0,0,1,3],acc:1,
 n:{ko:"국립청주박물관",en:"Cheongju National Museum",zh:"国立清州博物馆"},r:{ko:"청주시 상당구",en:"Cheongju",zh:"清州市"},
 s:{ko:"국립청주박물관은 충북의 문화유산을 조사하고 전시하는 박물관으로, 1987년 10월 30일에 문을 열었어요. 건물은 우리나라의 대표 건축가 김수근이 설계했어요. 선사 시대부터 조선 시대까지의 유물을 볼 수 있고, 어린이박물관에서는 놀이하며 문화유산을 배울 수 있어요.",
  en:"Cheongju National Museum researches and exhibits the heritage of Chungcheongbuk-do. It opened on 30 October 1987, in a building designed by the renowned Korean architect Kim Swoo-geun. You can see artifacts from prehistoric times to the Joseon period, and the children's museum lets kids learn about heritage through play.",
  zh:"国立清州博物馆调查并展示忠清北道的文化遗产，于1987年10月30日开馆。建筑由韩国代表性建筑师金寿根设计。这里可以看到从史前到朝鲜时代的文物，儿童博物馆还能让孩子们在游戏中了解文化遗产。"},
 q:{ko:["국립청주박물관이 문을 연 해는?",["1987년","1377년","2018년"],0],en:["In which year did Cheongju National Museum open?",["1987","1377","2018"],0],zh:["国立清州博物馆是哪一年开馆的？",["1987年","1377年","2018年"],0]}},
{id:"jikji",kind:"book",ll:[36.6435,127.4718],v:[3,0,0,0,1,3],acc:2,
 n:{ko:"청주 고인쇄박물관·흥덕사지",en:"Cheongju Early Printing Museum & Heungdeoksa Temple Site",zh:"清州古印刷博物馆·兴德寺址"},
 r:{ko:"청주시",en:"Cheongju",zh:"清州市"},
 s:{ko:"1377년, 청주 흥덕사에서 「직지심체요절」이 금속활자로 찍혀 나왔어요. 지금 남아 있는 금속활자 책 가운데 가장 오래된 것으로, 2001년 유네스코 세계기록유산이 되었어요. 박물관에서는 활자를 만들고 책을 찍는 과정을 한눈에 볼 수 있어요.",
  en:"In 1377, Jikji was printed with metal movable type at Heungdeoksa Temple in Cheongju. It is the oldest surviving book printed with metal type and joined UNESCO's Memory of the World in 2001. The museum shows how the type was cast and the book was printed.",
  zh:"1377年，《直指心体要节》在清州兴德寺用金属活字印刷而成。它是现存最古老的金属活字本，2001年被列入联合国教科文组织世界记忆遗产。博物馆展示了铸字和印书的全过程。"},
 q:{ko:["「직지」가 흥덕사에서 찍혀 나온 해는?",["1377년","1592년","1443년"],0],en:["In which year was Jikji printed at Heungdeoksa?",["1377","1592","1443"],0],zh:["《直指》在兴德寺印刷是哪一年？",["1377年","1592年","1443年"],0]}},

 n:{ko:"청주 상당산성",en:"Sangdangsanseong Fortress",zh:"清州上党山城"},r:{ko:"청주시",en:"Cheongju",zh:"清州市"},
 s:{ko:"상당산성은 청주를 지키던 산성이에요. 조선 숙종 때 돌로 다시 쌓았고, 성벽 둘레가 약 4.2킬로미터나 돼요. 성벽 길을 따라 걸으면 청주 시내와 산줄기가 시원하게 내려다보여요.",
  en:"Sangdangsanseong is a mountain fortress that guarded Cheongju. It was rebuilt in stone during King Sukjong's reign in the Joseon period, and its walls run about 4.2 km. Walking along the wall gives wide views over the city and the hills.",

 s:{ko:"정북동 토성은 아주 오래전 사람들이 흙을 다져 네모나게 쌓은 성이에요. 넓은 들판 한가운데 있어 해 질 무렵 노을과 소나무가 어우러진 모습이 아름다워 사진 명소로도 유명해요.",

 s:{ko:"농다리는 고려 시대에 놓였다고 전해지는 돌다리예요. 자줏빛 돌을 시멘트 없이 쌓아 28칸으로 이었는데, 구불구불한 모습이 마치 지네 같아요. 천 년 가까이 큰물에도 떠내려가지 않았다고 해요.",
  en:"Nongdari is a stone bridge said to date from the Goryeo period. Reddish-purple stones are stacked without mortar into 28 spans, and its winding shape looks like a centipede. It is said to have withstood floods for nearly a thousand years.",
  zh:"笼桥相传建于高丽时期，是用紫色石头不加水泥垒成的石桥，共28孔，蜿蜒的样子像一条蜈蚣。据说近千年来洪水都没能把它冲走。"},

{id:"beopjusa",kind:"temple",ll:[36.5422,127.8335],v:[3,3,2,2,2,1],acc:1,
 n:{ko:"보은 법주사",en:"Beopjusa Temple, Boeun",zh:"报恩法住寺"},r:{ko:"보은군 속리산",en:"Songnisan, Boeun",zh:"报恩郡俗离山"},
 s:{ko:"속리산 품에 안긴 법주사는 2018년 「산사, 한국의 산지승원」으로 유네스코 세계유산이 되었어요. 국보 팔상전은 우리나라에 하나뿐인 나무로 만든 5층 탑이에요. 부처님의 일생을 그린 여덟 장면의 그림이 그 안에 모셔져 있어요.",
  en:"Nestled in Songnisan, Beopjusa became a UNESCO World Heritage Site in 2018 as part of 'Sansa, Buddhist Mountain Monasteries in Korea'. Its Palsangjeon Hall, a National Treasure, is Korea's only surviving five-storey wooden pagoda, housing eight paintings of the Buddha's life.",
  zh:"坐落在俗离山怀抱中的法住寺，于2018年作为“山寺，韩国的山地僧院”被列入世界遗产。国宝捌相殿是韩国唯一现存的五层木塔，里面供奉着描绘佛陀一生的八幅画。"},
 q:{ko:["법주사 팔상전은 몇 층 나무 탑일까요?",["5층","3층","9층"],0],en:["How many storeys does Palsangjeon have?",["5","3","9"],0],zh:["法住寺捌相殿是几层木塔？",["5层","3层","9层"],0]}},

 s:{ko:"통일신라 때 세운 국보 칠층석탑이에요. 우리 땅의 한가운데에 있다고 해서 '중앙탑'이라고도 불러요. 높이가 약 14.5미터로, 통일신라 석탑 가운데 가장 높아요. 탑 주변 공원은 평평해서 산책하기 좋아요.",
  en:"This National Treasure was built in the Unified Silla period. It is nicknamed 'Jungangtap' (Central Pagoda) because it was said to stand at the centre of the land. About 14.5 m tall, it is the tallest stone pagoda from Unified Silla. The park around it is flat and pleasant for a stroll.",
  zh:"这是统一新罗时期建造的国宝七层石塔。因被认为位于国土中央，又称“中央塔”。塔高约14.5米，是统一新罗石塔中最高的。周边公园地势平坦，适合散步。"},

{id:"cheongpung",kind:"village",ll:[37.0040,128.1770],v:[3,1,2,2,2,3],acc:1,

 s:{ko:"충주댐이 생기면서 물에 잠기게 된 마을의 문화유산을 1985년 무렵 이곳으로 옮겨 모았어요. 보물 한벽루와 옛 관아, 초가집이 호수를 내려다보고 있어서 옛 마을을 걷는 기분이 들어요.",
  en:"When the Chungju Dam was built, heritage from villages about to be flooded was moved here around 1985. Hanbyeongnu Pavilion, an old government office and thatched houses overlook the lake, so it feels like walking through an old village.",
  zh:"修建忠州大坝时，即将被淹没的村庄文物在1985年前后被迁到这里。宝物寒碧楼、旧官衙和草屋俯瞰着湖水，漫步其中仿佛走进了古老的村庄。"},

 s:{ko:"남한강 한가운데 세 개의 바위 봉우리가 솟아 있는 명승이에요. 조선을 세운 정도전이 이 풍경을 아껴 자신의 호를 '삼봉'이라 지었다고 전해져요. 주차장 가까이에서도 경치를 볼 수 있어요.",
  en:"Three rocky peaks rise from the middle of the Namhangang River at this scenic site. Jeong Do-jeon, a founder of Joseon, is said to have loved the view so much that he took 'Sambong' as his pen name. You can see it from near the car park.",
  zh:"三座岩石山峰矗立在南汉江中央，是著名的名胜。相传朝鲜开国功臣郑道传非常喜爱这里的风景，便以“三峰”为号。在停车场附近就能欣赏到美景。"},
 q:{ko:["도담삼봉의 봉우리는 몇 개일까요?",["3개","5개","9개"],0],en:["How many peaks make up Dodamsambong?",["3","5","9"],0],zh:["岛潭三峰共有几座山峰？",["3座","5座","9座"],0]}}

cheongpung:{ko:["보물로 지정된 한벽루는 강가의 멋진 누각으로 유명해요.","단지에서는 청풍호(충주호)가 넓게 내려다보여요.","옛 관아, 향교, 초가집, 비석 등이 모여 있어 옛 마을을 걷는 것처럼 둘러볼 수 있어요."],

function scene(kind){

  if(kind==="fortress"){s+=`<path d="M0 230 Q150 150 300 230 V300H0Z" fill="#5c8f5f"/>`;for(let i=0;i<15;i++){const x=i*20,y=222-Math.sin(i/14*Math.PI)*58;s+=`<rect x="${x}" y="${y}" width="18" height="34" fill="#b9b2a3" stroke="#7f786b"/><rect x="${x+3}" y="${y-10}" width="12" height="10" fill="#a39b8b"/>`}

    for(let i=0;i<14;i++)s+=`<ellipse cx="${14+i*21}" cy="${226+Math.sin(i/2)*5}" rx="9" ry="3" fill="#2d6aa0"/>`;}
  if(kind==="temple"){s+=`<rect y="240" width="300" height="60" fill="#c9b48a"/><rect x="105" y="215" width="90" height="28" fill="#8f877a"/>`;
    for(let i=0;i<5;i++){const w=110-i*16,x=150-w/2,y=200-i*30;s+=`<rect x="${x+12}" y="${y}" width="${w-24}" height="18" fill="#c2412e"/><rect x="${x+14}" y="${y+3}" width="${w-28}" height="5" fill="#2f7f6f"/>${roof(x,y-14,w,16,"#3a4442")}`}

/* ---------- 추천 (취향 벡터 유사도 + 거리 + 이동 편의) ---------- */
function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function trip(s){const road=dist(ORIG[origin],s.ll)*1.35;return{km:Math.round(road/5)*5||5,min:Math.round((road/60*60+10)/5)*5}}
function rank(){
  const u=[1,1,1,1,1,1];
  ans[1].forEach(i=>{u[[0,1,2,3,4][i]]+=3});
  const who=ans[0];if(who===2)u[5]+=4;if(who===4){u[0]+=3;u[5]+=2}if(who===1)u[4]+=2;if(who===3)u[3]-=1;
  const lim=[60,110,999][ans[2]],need=ans[3]+(who===3?1:0);
  const norm=v=>Math.sqrt(v.reduce((a,x)=>a+x*x,0));
  ranked=S.map(s=>{
    const cos=u.reduce((a,x,i)=>a+x*s.v[i],0)/(norm(u)*norm(s.v));
    const tr=trip(s);const timeFit=tr.min<=lim?1:Math.max(0,1-(tr.min-lim)/60);
    const accFit=need===0?1:need===1?[.3,.7,1][s.acc]:[0,.4,1][s.acc];
    const score=cos*62+timeFit*22+accFit*16;
    const top=u.map((x,i)=>[x*s.v[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,2).filter(x=>x[0]>3).map(x=>x[1]);
    return{s,tr,score,top,near:tr.min<=40,easy:need>0&&s.acc===2};
  }).sort((a,b)=>b.score-a.score);
}
function renderResults(topOnly){
  allMode=!topOnly;if(!origin)return;if(!ranked.length)rank();
  const list=topOnly?ranked.slice(0,3):ranked;

  $("resLead").textContent=topOnly?t("resL")(t("oName")[origin]):t("allL");
  $("results").innerHTML=list.map((r,i)=>{
    const pct=Math.max(40,Math.min(98,Math.round(r.score)));
    const why=[...r.top.map(k=>t("whyTag")[k]),...(r.near?[t("whyNear")]:[]),...(r.easy?[t("whyAcc")]:[])];
    return `<article class="res"><div class="pic">${pic(r.s)}</div><div>
    <h3><span class="rank">${i+1}</span>${esc(r.s.n[lang])}</h3>
    <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div><small>${pct}% ${esc(t("match"))}</small>
    <div class="facts"><span>${esc(r.s.r[lang])}</span><span>${esc(t("km")(r.tr.km))} · ${esc(t("drive")(r.tr.min))}</span><span>${esc(t("acc")[r.s.acc])}</span></div>
    ${why.length?`<p class="why"><b>${esc(t("why"))}</b>${esc(why.join(", "))}</p>`:""}
    <div class="acts"><button class="act main" data-go="${r.s.id}" data-tb="puzzle">${esc(t("tPuzzle"))}</button><button class="act" data-go="${r.s.id}" data-tb="story">${esc(t("tStory"))}</button><button class="act" data-go="${r.s.id}" data-tb="quiz">${esc(t("tQuiz"))}</button></div>
    </div></article>`}).join("");
  $("results").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{curImg=null;openSite(S.find(s=>s.id===b.dataset.go),b.dataset.tb,2);show(3)});
}

function newPuzzle(st){st=st&&st.box?st:PZ;st.order=[0,1,2,3,4,5,6,7,8];do{st.order.sort(()=>Math.random()-.5)}while(st.order.every((v,i)=>v===i));st.sel=null;st.moves=0;drawPuzzle(st)}

/* ---------- AI 보이스 (브라우저 음성 합성) ---------- */
let speaking=false;
function speak(text,short){
  const ss=window.speechSynthesis;
  if(!ss||typeof SpeechSynthesisUtterance==="undefined"){const m=$("vMsg");if(m&&!short)m.textContent=t("noVoice");return}
  try{ss.cancel();const u=new SpeechSynthesisUtterance(text);u.lang={ko:"ko-KR",en:"en-US",zh:"zh-CN"}[lang];u.rate=.95;
    const v=ss.getVoices().find(x=>x.lang&&x.lang.replace("_","-").startsWith(u.lang.slice(0,2)));if(v)u.voice=v;
    u.onstart=()=>{speaking=true;document.querySelectorAll(".playBtn").forEach(b=>b.textContent=t("stop"))};
    u.onend=u.onerror=()=>{speaking=false;document.querySelectorAll(".playBtn").forEach(b=>b.textContent=t("play"))};
    ss.speak(u)}catch(e){const m=$("vMsg");if(m)m.textContent=t("noVoice")}
}
function stopVoice(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}speaking=false;document.querySelectorAll(".playBtn").forEach(b=>b.textContent=t("play"))}

  const fmt=x=>new Date(x).toLocaleTimeString(lang==="zh"?"zh-CN":lang,{hour:"2-digit",minute:"2-digit"});
  $("w_points").innerHTML=`<div class="ptsTop"><div class="ptsCoin" aria-hidden="true">P</div><div><small>${esc(t("ptsT"))}</small><div class="ptsBig">${pts.total.toLocaleString()}<span>P</span></div></div><button class="go" id="toRank" style="margin:0 0 0 auto">${esc(t("rankT"))} →</button></div>
   <div class="ptsCols"><div><h3>${esc(t("ptHow"))}</h3><ul class="ptsHow">${t("ptHowList").map(([a,b])=>`<li><span>${esc(a)}</span><b>${esc(b)}</b></li>`).join("")}</ul></div>
   <div><h3>${esc(t("ptLog"))}</h3>${pts.log.length?`<ul class="ptsLog">${pts.log.map(l=>{const s=l.site&&S.find(x=>x.id===l.site);return `<li><span>${esc(t("ptR")[l.r]||l.r)}${s?` · ${esc(sh(s))}`:""}</span><b>+${l.n}P</b><small>${esc(fmt(l.at))}</small></li>`}).join("")}</ul>`:`<p>${esc(t("ptNone"))}</p>`}</div></div>`;
}
$("ptsBtn").onclick=()=>openWin("points");
document.addEventListener("click",e=>{if(e.target&&e.target.id==="toRank")openWin("rank")});
updatePts();

/* ---------- 포인트 랭킹 ---------- */
let nick="";try{nick=localStorage.getItem("cb-nick")||""}catch(e){}
let localRank={};try{localRank=JSON.parse(localStorage.getItem("cb-rank-local")||"{}")}catch(e){}
let rankDb=null,myUid=null,rankRows=null,rankErr=false,rankMsg="",syncT=null,resetArm=false;
function saveLocalRank(){if(!nick)return;localRank[nick]=pts.total;try{localStorage.setItem("cb-rank-local",JSON.stringify(localRank))}catch(e){}}
async function pushRank(){
  saveLocalRank();
  if(!(rankDb&&myUid&&nick))return true;
  try{await rankDb.doc("rank/"+myUid).set({nick:nick.slice(0,12),pts:pts.total,at:Date.now()});return true}catch(e){return false}
}
function syncRank(){if(!nick)return;clearTimeout(syncT);syncT=setTimeout(pushRank,1500)}
(async()=>{try{
  if(typeof claude==="undefined"||!claude.use)return;
  const db=await claude.use("db"),u=await claude.use("user");if(!db||!u)return;
  const id=await u.id();if(!id)return;rankDb=db;myUid=id;
  const timer=setTimeout(()=>{if(rankRows===null){rankErr=true;if(winK==="rank")renderRank()}},10000);
  db.collection("rank").orderBy("pts","desc").limit(50).onSnapshot(sn=>{
    if(!sn.metadata.fromCache)clearTimeout(timer);rankErr=false;
    rankRows=sn.docs.map(d=>{const x=d.data()||{};return{id:d.id,nick:String(x.nick||"?").slice(0,12),pts:Number(x.pts)||0}});
    if(winK==="rank")renderRank();
  },()=>{clearTimeout(timer);rankErr=true;if(winK==="rank")renderRank()});
  if(winK==="rank")renderRank();
}catch(e){}})();
function renderRank(){
  const shared=rankDb&&rankRows!==null&&!rankErr;
  const rows=shared?rankRows:Object.entries(localRank).map(([k,v])=>({id:"l:"+k,nick:k,pts:v})).sort((a,b)=>b.pts-a.pts);
  const isMe=r=>shared?r.id===myUid:r.nick===nick;
  const note=rankDb&&rankRows===null&&!rankErr?t("rankLoading"):shared?t("rankShared"):t("rankLocal");
  $("w_rank").innerHTML=`<div class="rkMe">
     <div class="rkMePts"><span class="coin" aria-hidden="true">P</span><b>${pts.total.toLocaleString()}</b><small>P</small></div>
     <form id="nickForm" class="rkForm"><input id="nickIn" maxlength="12" autocomplete="off" placeholder="${esc(t("nickPh"))}" aria-label="${esc(t("nickPh"))}"><button class="go" type="submit">${esc(t("nickSave"))}</button></form>
     <p class="msg" id="rkMsg">${esc(rankMsg)}</p>
   </div>
   <p class="rkNote">${esc(note)}</p>
   ${rows.length?`<ol class="rkList">${rows.slice(0,30).map((r,i)=>`<li class="${isMe(r)?"me":""} ${i<3?"top"+(i+1):""}"><span class="rkNo">${i+1}</span><span class="rkNick"></span><b>${r.pts.toLocaleString()}P</b></li>`).join("")}</ol>`:`<p class="rkEmpty">${esc(t("rankEmpty"))}</p>`}
   <button class="ghost" id="newPlayer" style="margin-top:18px">${esc(resetArm?t("newPlayerSure"):t("newPlayer"))}</button>`;
  $("w_rank").querySelectorAll(".rkNick").forEach((el,i)=>{el.textContent=rows[i].nick});
  $("nickIn").value=nick;
  $("nickForm").onsubmit=async e=>{e.preventDefault();const v=$("nickIn").value.trim().slice(0,12);
    if(!v){rankMsg=t("nickNeed");renderRank();return}
    if(nick&&nick!==v&&localRank[nick]!==undefined&&!rankDb){delete localRank[nick]}
    nick=v;try{localStorage.setItem("cb-nick",nick)}catch(err){}
    const ok=await pushRank();rankMsg=ok?t("nickSaved"):t("writeFail");if(!ok)rankDb=null;renderRank()};
  $("newPlayer").onclick=()=>{if(!resetArm){resetArm=true;renderRank();return}
    resetArm=false;saveLocalRank();pts={total:0,log:[],studied:{},quizDone:{}};savePts();updatePts();
    nick="";try{localStorage.removeItem("cb-nick")}catch(e){}myUidReset();rankMsg="";renderRank()};
}
function myUidReset(){/* 공유 랭킹은 로그인한 계정당 한 줄이라 그대로 둬요 */}
$("rankBtn").onclick=()=>openWin("rank");

/* ---------- 홈 검색 ---------- */
function homeSearch(){
  const k=norm($("hq").value);if(!k){$("hqRes").innerHTML="";return}
  const hit=S.filter(s=>norm([s.n.ko,s.n.en,s.n.zh,s.r.ko,s.r.en,s.r.zh,s.s[lang],SH[s.id].join(" ")].join(" ")).includes(k));
  $("hqRes").innerHTML=hit.length?hit.map(s=>`<div class="hsr"><div class="hsrPic">${s.imgs?`<img src="${s.imgs[0]}" alt="">`:scene(s.kind)}</div><div class="hsrTxt"><b>${esc(s.n[lang])}</b><small>${esc(s.r[lang])}</small></div><div class="acts"><button class="act main" data-hs="${s.id}" data-a="puzzle">${esc(t("tPuzzle"))}</button><button class="act" data-hs="${s.id}" data-a="quiz">${esc(t("tQuiz"))}</button><button class="act" data-hs="${s.id}" data-a="story">${esc(t("tStory"))}</button></div></div>`).join(""):`<p class="hsrNone">${esc(t("noRes"))}</p>`;
  $("hqRes").querySelectorAll("[data-hs]").forEach(b=>b.onclick=()=>{const s=S.find(x=>x.id===b.dataset.hs),a=b.dataset.a;
    if(a==="puzzle"){pickPuzzle({src:s.imgs?s.imgs[0]:null,site:s});openWin("puzzle")}
    else if(a==="quiz"){curImg=null;openSite(s,"quiz",0);show(3)}
    else{studyCur=s;openWin("study")}});
}
$("hq").addEventListener("input",homeSearch);

renderHome();
renderBook();
}
</script>
